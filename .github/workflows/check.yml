name: checks

on: [pull_request]

jobs:
  check-all:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # to write test coverage report comment
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: false
      - run: vp run ci

      - uses: davelosert/vitest-coverage-report-action@v2
        if: always()
