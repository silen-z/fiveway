packages:
  - "packages/*"
  - "examples/*"
  - docs

allowBuilds:
  esbuild: false
  spawn-sync: false

catalog:
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.22
  vite-plus: ^0.1.22
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.22

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@solidjs/start>h3": "2.0.1-rc.20"

patchedDependencies:
  "@solidjs/start": patches/@solidjs__start.patch

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
