packages:
  - "packages/*"
  - "examples/*"
  - docs

catalog:
  typescript: ^6.0.3
  vite-plus: ^0.1.18
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

overrides:
  typescript: "catalog:"
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
