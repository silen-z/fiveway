packages:
  - "packages/*"
  - "examples/*"
  - docs

allowBuilds:
  esbuild: false
  spawn-sync: false

catalog:
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  vitest: 4.1.11
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11

minimumReleaseAgeExclude:
  - "@solidjs/start@2.0.0-rc.2"
  - solid-js@2.0.0-rc.0 || 2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9
  - "@solidjs/web@2.0.0-rc.0 || 2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/router@2.0.0-next.16 || 2.0.0-next.24 || 2.0.0-next.30"
  - "@solidjs/meta@1.0.0-next.2"
  - "@solidjs/testing-library@1.0.0-beta.3"
  - "@solidjs/vite-plugin@3.0.0-next.28 || 3.0.0-next.34 || 3.0.0-next.43 || 3.0.0-next.44"
  - filesystem-routing@0.2.1 || 0.3.1 || 0.4.0
  - "@solidjs/signals@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/babel-plugin@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler-darwin-arm64@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler-darwin-x64@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"
  - "@solidjs/compiler@2.0.0-rc.3 || 2.0.0-rc.8 || 2.0.0-rc.9"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
