packages:
  - "packages/*"
  - "examples/*"
  - docs

catalog:
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.21
  vite-plus: ^0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.21

overrides:
  vite: "catalog:"
  vitest: "catalog:"

patchedDependencies:
  "@solidjs/start": patches/@solidjs__start.patch

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
