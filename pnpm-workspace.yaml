packages:
  - "packages/*"
  - "examples/*"
  - docs

allowBuilds:
  esbuild: false
  spawn-sync: false

catalog:
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  vitest: 4.1.10
  "@vitest/browser": 4.1.10
  "@vitest/browser-playwright": 4.1.10
  "@vitest/coverage-v8": 4.1.10

minimumReleaseAgeExclude:
  - "@solidjs/start@2.0.0-rc.2"
  - solid-js@2.0.0-rc.0 || 2.0.0-rc.3 || 2.0.0-rc.8
  - "@solidjs/web@2.0.0-rc.0 || 2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/router@2.0.0-next.16 || 2.0.0-next.24"
  - "@solidjs/meta@1.0.0-next.2"
  - "@solidjs/vite-plugin@3.0.0-next.28 || 3.0.0-next.34 || 3.0.0-next.43"
  - filesystem-routing@0.2.1 || 0.3.1
  - "@solidjs/signals@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/babel-plugin@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler-darwin-arm64@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler-darwin-x64@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.3 || 2.0.0-rc.8"
  - "@solidjs/compiler@2.0.0-rc.3 || 2.0.0-rc.8"

overrides:
  vite: "catalog:"

patchedDependencies:
  filesystem-routing: patches/filesystem-routing.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
